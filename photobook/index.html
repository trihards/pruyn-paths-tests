<style>/*! PhotoSwipe main CSS by Dmytro Semenov | photoswipe.com */

.pswp {

/*
	Styles for basic PhotoSwipe (pswp) functionality (sliding area, open/close transitions)
*/

.pswp {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	z-index: var(--pswp-root-z-index);
	display: none;
	touch-action: none;
	outline: 0;
	opacity: 0.003;
	contain: layout style size;
	-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
}

/* Prevents focus outline on the root element,
  (it may be focused initially) */
.pswp:focus {
  outline: 0;
}

.pswp * {
  box-sizing: border-box;
}

.pswp img {
  max-width: none;
}

.pswp--open {
	display: block;
}

.pswp,
.pswp__bg {
	transform: translateZ(0);
	will-change: opacity;
}

.pswp__bg {
  opacity: 0.005;
	background: var(--pswp-bg);
}

.pswp,
.pswp__scroll-wrap {
	overflow: hidden;
}

.pswp__scroll-wrap,
.pswp__bg,
.pswp__container,
.pswp__item,
.pswp__content,
.pswp__img,
.pswp__zoom-wrap {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
}

.pswp__img,
.pswp__zoom-wrap {
	width: auto;
	height: auto;
}

.pswp--click-to-zoom.pswp--zoom-allowed .pswp__img {
	cursor: -webkit-zoom-in;
	cursor: -moz-zoom-in;
	cursor: zoom-in;
}

.pswp--click-to-zoom.pswp--zoomed-in .pswp__img {
	cursor: move;
	cursor: -webkit-grab;
	cursor: -moz-grab;
	cursor: grab;
}

.pswp--click-to-zoom.pswp--zoomed-in .pswp__img:active {
  cursor: -webkit-grabbing;
  cursor: -moz-grabbing;
  cursor: grabbing;
}

/* :active to override grabbing cursor */
.pswp--no-mouse-drag.pswp--zoomed-in .pswp__img,
.pswp--no-mouse-drag.pswp--zoomed-in .pswp__img:active,
.pswp__img {
	cursor: -webkit-zoom-out;
	cursor: -moz-zoom-out;
	cursor: zoom-out;
}


/* Prevent selection and tap highlights */
.pswp__container,
.pswp__img,
.pswp__button,
.pswp__counter {
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	user-select: none;
}

.pswp__item {
	/* z-index for fade transition */
	z-index: 1;
	overflow: hidden;
}

.pswp__hidden {
	display: none !important;
}

/* Allow to click through pswp__content element, but not its children */
.pswp__content {
  pointer-events: none;
}
.pswp__content > * {
  pointer-events: auto;
}


/*

  PhotoSwipe UI

*/

/*
	Error message appears when image is not loaded
	(JS option errorMsg controls markup)
*/
.pswp__error-msg-container {
  display: grid;
}
.pswp__error-msg {
	margin: auto;
	font-size: 1em;
	line-height: 1;
	color: var(--pswp-error-text-color);
}

/*
class pswp__hide-on-close is applied to elements that
should hide (for example fade out) when PhotoSwipe is closed
and show (for example fade in) when PhotoSwipe is opened
 */
.pswp .pswp__hide-on-close {
	opacity: 0.005;
	will-change: opacity;
	transition: opacity var(--pswp-transition-duration) cubic-bezier(0.4, 0, 0.22, 1);
	z-index: 10; /* always overlap slide content */
	pointer-events: none; /* hidden elements should not be clickable */
}

/* class pswp--ui-visible is added when opening or closing transition starts */
.pswp--ui-visible .pswp__hide-on-close {
	opacity: 1;
	pointer-events: auto;
}

/* <button> styles, including css reset */
.pswp__button {
	position: relative;
	display: block;
	width: 50px;
	height: 60px;
	padding: 0;
	margin: 0;
	overflow: hidden;
	cursor: pointer;
	background: none;
	border: 0;
	box-shadow: none;
	opacity: 0.85;
	-webkit-appearance: none;
	-webkit-touch-callout: none;
}

.pswp__button:hover,
.pswp__button:active,
.pswp__button:focus {
  transition: none;
  padding: 0;
  background: none;
  border: 0;
  box-shadow: none;
  opacity: 1;
}

.pswp__button:disabled {
  opacity: 0.3;
  cursor: auto;
}

.pswp__icn {
  fill: var(--pswp-icon-color);
  color: var(--pswp-icon-color-secondary);
}

.pswp__icn {
  position: absolute;
  top: 14px;
  left: 9px;
  width: 32px;
  height: 32px;
  overflow: hidden;
  pointer-events: none;
}

.pswp__icn-shadow {
  stroke: var(--pswp-icon-stroke-color);
  stroke-width: var(--pswp-icon-stroke-width);
  fill: none;
}

.pswp__icn:focus {
	outline: 0;
}

/*
	div element that matches size of large image,
	large image loads on top of it,
	used when msrc is not provided
*/
div.pswp__img--placeholder,
.pswp__img--with-bg {
	background: var(--pswp-placeholder-bg);
}

.pswp__top-bar {
	position: absolute;
	left: 0;
	top: 0;
	width: 100%;
	height: 60px;
	display: flex;
  flex-direction: row;
  justify-content: flex-end;
	z-index: 10;

	/* allow events to pass through top bar itself */
	pointer-events: none !important;
}
.pswp__top-bar > * {
  pointer-events: auto;
  /* this makes transition significantly more smooth,
     even though inner elements are not animated */
  will-change: opacity;
}


/*

  Close button

*/
.pswp__button--close {
  margin-right: 6px;
}


/*

  Arrow buttons

*/
.pswp__button--arrow {
  position: absolute;
  top: 0;
  width: 75px;
  height: 100px;
  top: 50%;
  margin-top: -50px;
}

.pswp__button--arrow:disabled {
  display: none;
  cursor: default;
}

.pswp__button--arrow .pswp__icn {
  top: 50%;
  margin-top: -30px;
  width: 60px;
  height: 60px;
  background: none;
  border-radius: 0;
}

.pswp--one-slide .pswp__button--arrow {
  display: none;
}

/* hide arrows on touch screens */
.pswp--touch .pswp__button--arrow {
  visibility: hidden;
}

/* show arrows only after mouse was used */
.pswp--has_mouse .pswp__button--arrow {
  visibility: visible;
}

.pswp__button--arrow--prev {
  right: auto;
  left: 0px;
}

.pswp__button--arrow--next {
  right: 0px;
}
.pswp__button--arrow--next .pswp__icn {
  left: auto;
  right: 14px;
  /* flip horizontally */
  transform: scale(-1, 1);
}

/*

  Zoom button

*/
.pswp__button--zoom {
  display: none;
}

.pswp--zoom-allowed .pswp__button--zoom {
  display: block;
}

/* "+" => "-" */
.pswp--zoomed-in .pswp__zoom-icn-bar-v {
  display: none;
}


/*

  Loading indicator

*/
.pswp__preloader {
  position: relative;
  overflow: hidden;
  width: 50px;
  height: 60px;
  margin-right: auto;
}

.pswp__preloader .pswp__icn {
  opacity: 0;
  transition: opacity 0.2s linear;
  animation: pswp-clockwise 600ms linear infinite;
}

.pswp__preloader--active .pswp__icn {
  opacity: 0.85;
}

@keyframes pswp-clockwise {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}


/*

  "1 of 10" counter

*/
.pswp__counter {
  height: 30px;
  margin-top: 15px;
  margin-inline-start: 20px;
  font-size: 14px;
  line-height: 30px;
  color: var(--pswp-icon-color);
  text-shadow: 1px 1px 3px var(--pswp-icon-color-secondary);
  opacity: 0.85;
}

.pswp--one-slide .pswp__counter {
  display: none;
}

/* Pruyn Paths photo storybook: quiet, photo-led. Dark warm surround so photos carry the colour; serif for the author's words,
   system sans for the few controls. Phone portrait first; phone landscape puts the words beside the photo; wide screens centre a column. */
:root {
  --bg: #11110f; --ink: #f1ede4; --muted: #a8a196; --faint: #6d685f; --line: rgba(241, 237, 228, .14);
  --chip: rgba(241, 237, 228, .1); --chip-on: #f1ede4; --chip-on-ink: #11110f;
  --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fade: 700ms;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }

.book { position: fixed; inset: 0; }
.book > section { position: absolute; inset: 0; }

/* Opening and ending */
.cover, .end { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.cover-photo, .end-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.end-photo { opacity: .55; }
.cover-shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(17,17,15,0) 30%, rgba(17,17,15,.55) 62%, rgba(17,17,15,.92) 100%); }
.cover-text {
  position: relative; max-width: 640px; width: 100%; margin: 0 auto; max-height: 100%; overflow-y: auto;
  padding: 24px max(24px, env(safe-area-inset-right)) max(32px, calc(env(safe-area-inset-bottom) + 20px)) max(24px, env(safe-area-inset-left));
  animation: rise 1.2s ease-out both;
}
.cover h1, .end h2 { font: 500 clamp(30px, 8vw, 46px)/1.12 var(--serif); margin: 0 0 12px; letter-spacing: -.01em; text-wrap: balance; }
.cover-intro { font: 18px/1.55 var(--serif); color: var(--ink); opacity: .9; margin: 0 0 22px; white-space: pre-line; }
.cover-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 8px; }
.begin { border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 17px; padding: 13px 26px; min-height: 48px; }
.pill { border: 1px solid var(--line); border-radius: 999px; background: var(--chip); padding: 10px 16px; min-height: 44px; font-size: 15px; color: var(--ink); }
.pill.icon { width: 44px; padding: 0; display: inline-grid; place-items: center; }
.music-toggle[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.kicker { font: 600 11px/1.3 var(--sans); letter-spacing: .14em; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* The story pages */
.page {
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  max-width: 1200px; margin: 0 auto;
}
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
.top { justify-content: space-between; min-height: 56px; }
.book-title { font: 15px/1.3 var(--serif); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar-controls { display: flex; align-items: center; gap: 8px; flex: none; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--chip); }
.mode button { border: 0; background: none; border-radius: 999px; padding: 0 14px; min-height: 36px; font-size: 14px; color: var(--muted); }
.mode button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 600; }

.frame { position: relative; min-height: 0; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.shot {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0;
  transition: opacity var(--fade) ease; cursor: zoom-in; -webkit-touch-callout: none; pointer-events: none;
}
.shot.on { opacity: 1; pointer-events: auto; }
.frame:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
.frame.text-only { display: none; } /* the words move into the photo's row and sit centred there */
.shot-dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.shot-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(241,237,228,.35); box-shadow: 0 0 2px rgba(0,0,0,.5); }
.shot-dots span.on { background: var(--ink); }
.hint {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%); margin: 0; padding: 7px 14px; border-radius: 999px;
  background: rgba(17,17,15,.72); color: var(--ink); font-size: 13px; pointer-events: none; white-space: nowrap;
  animation: hint 4.5s ease both;
}
@keyframes hint { 0%, 100% { opacity: 0; } 12%, 80% { opacity: 1; } }

.words {
  max-height: 38vh; max-height: 38dvh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 16px 22px 6px; width: 100%; max-width: 680px; margin: 0 auto;
}
.words:empty, .words.quiet { padding: 6px 22px 0; }
.moment-title { font: 600 21px/1.3 var(--serif); margin: 0 0 6px; }
.caption { font: 19px/1.58 var(--serif); margin: 0 0 8px; white-space: pre-line; overflow-wrap: anywhere; }
.frame.text-only + .words { align-self: center; max-height: none; grid-row: 2; }
.frame.text-only + .words .caption { font-size: 22px; }

.bottom { gap: 12px; padding: 6px 12px 10px; }
.step { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--chip); font-size: 20px; }
.step:disabled { opacity: .35; cursor: default; }
.progress { position: relative; flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--muted); transition: width 400ms ease; }
.dwell { position: absolute; left: 0; bottom: 0; height: 100%; width: 0; background: var(--ink); opacity: .5; }
.count { flex: none; min-width: 52px; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Phone on its side: the photo on the left, words on the right */
@media (orientation: landscape) and (max-height: 540px) {
  .page { grid-template-columns: minmax(0, 1fr) minmax(220px, 36%); grid-template-rows: auto minmax(0, 1fr) auto; }
  .top { grid-column: 1 / -1; min-height: 48px; padding-block: 4px; }
  .frame { grid-row: 2; grid-column: 1; }
  .words { grid-row: 2; grid-column: 2; max-height: none; align-self: center; padding: 8px 18px; }
  .bottom { grid-column: 1 / -1; padding-block: 2px 6px; }
  .frame.text-only + .words { grid-column: 1 / -1; }
}
/* Wide screens: a little more air */
@media (min-width: 900px) and (min-height: 600px) {
  .frame { margin: 0 24px; }
  .caption { font-size: 21px; }
  .words { padding-top: 22px; }
}

/* The zoom view (PhotoSwipe): caption along the bottom, shown and hidden with the controls */
.pswp { --pswp-bg: #0b0b0a; }
.pswp__caption {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 40%; overflow-y: auto;
  padding: 18px max(20px, env(safe-area-inset-right)) max(20px, calc(env(safe-area-inset-bottom) + 12px)) max(20px, env(safe-area-inset-left));
  background: linear-gradient(to top, rgba(11,11,10,.88), rgba(11,11,10,.6) 70%, rgba(11,11,10,0));
  font: 17px/1.5 var(--serif); color: var(--ink); white-space: pre-line; pointer-events: auto;
  transition: opacity 250ms ease;
}
.pswp__caption:empty { display: none; }
.pswp:not(.pswp--ui-visible) .pswp__caption { opacity: 0; pointer-events: none; }

/* Review build only: try the player with your own photos */
.review { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.review label { display: inline-flex; align-items: center; min-height: 44px; text-decoration: underline; color: var(--ink); cursor: pointer; }
.review input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* No-script fallback */
.nojs { max-width: 640px; margin: 0 auto; padding: 28px 22px; overflow: auto; height: 100%; font: 18px/1.55 var(--serif); }
.nojs h1 { font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  :root { --fade: 1ms; }
  .cover-text, .hint { animation: none; }
}
</style>

<noscript><main class="nojs"><h1>A Day Up High</h1><p>Eight photos, one long day, and a couple of very tired dogs.
(A demo story: the pictures are drawn by a computer and the music is a placeholder.)</p><ol><li><strong>Out the door before the sun</strong><br>Coffee in one hand, leash in the other. The dogs had opinions about the hour. ☕️🐕</li><li>The lake was so still it looked like a second sky. We stood there long enough for the coffee to go cold, which, honestly, is the highest compliment I can pay a view. 🏞️

Then the trail ducked into the trees and everything went quiet and green. You could smell the pine before you saw it. One of the dogs found a stick roughly the size of a canoe and carried it for a full mile out of pure stubbornness. We named it Gerald. Gerald did not make it to the top, but he will be remembered. 🌲🐾

This caption is deliberately long, so you can check that longer stories stay comfortable to read on a phone.</li><li>✨🌌✨</li><li><strong>The long way home</strong><br>Wildflowers, a sunset we didn’t deserve, and one last look back at the peak. Swipe through all three, or tap one to see it up close. 🌼🌅🏔️</li><li><strong>A note from the trail</strong><br>Somewhere around mile six we stopped talking and just listened. Worth every blister.</li></ol><h2>And that’s a wrap.</h2><p>Every good adventure deserves a good story. Thanks for coming along.</p><p>This storybook needs a web browser with JavaScript turned on. Open it in Safari, Chrome, Firefox or Edge.</p></main></noscript>

          status.textContent = msg;
        });
        status.textContent = own ? "" : "Those photos could not be opened here.";
        if (own) book.load(own);
      });
    }
  } catch (e) {
    fail(e instanceof StoryV2Error ? e.message : "This story could not be opened.");
  }
})();
</script>
</body>
